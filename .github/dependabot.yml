version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    ignore:
      # Rust is pinned on purpose: stable in most jobs, `rust-version` for msrv.
      - dependency-name: dtolnay/rust-toolchain
      # release.yml is generated by cargo-dist, and `dist generate --check` fails when
      # these actions differ from what its template pins. They move with cargo-dist:
      # raise `cargo-dist-version`, run `dist init`, and bump them in ci.yml then.
      - dependency-name: actions/checkout
      - dependency-name: actions/setup-node
      - dependency-name: actions/upload-artifact
      - dependency-name: actions/download-artifact
      - dependency-name: actions/attest
