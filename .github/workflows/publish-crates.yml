name: publish-crates

# Called by release.yml after the GitHub Release exists. It publishes the two
# crates to crates.io, the library first. A run that finds a version already
# published skips it, so a failed release can be re-run.

on:
  workflow_call:
    inputs:
      plan:
        description: The release plan from dist, as JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish oxispec-core, then oxispec
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::The secret CARGO_REGISTRY_TOKEN is not set."
            exit 1
          fi
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "oxispec") | .version')
          published() {
            curl -fsS -o /dev/null -H "User-Agent: oxispec-release (github.com/alexrgb/oxispec)" \
              "https://crates.io/api/v1/crates/$1/$version"
          }
          for crate in oxispec-core oxispec; do
            if published "$crate"; then
              echo "$crate $version is already on crates.io"
              continue
            fi
            cargo publish --locked -p "$crate"
            # The next crate needs this one in the index.
            for _ in $(seq 1 30); do
              published "$crate" && break
              sleep 10
            done
          done
