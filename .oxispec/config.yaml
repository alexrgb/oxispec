format: 1
modules:
- core
- specs
- tests
- adrs
- debt
- ci
topology: single
id_scheme: sequential
trace:
  exclude:
    # These hold annotations as test data, in strings that look like comments.
    - crates/oxispec-cli/tests/cli.rs
    - crates/oxispec-core/src/results.rs
    - crates/oxispec-core/src/suspect.rs
    - crates/oxispec-core/src/symbol.rs
    - crates/oxispec-core/src/trace.rs
