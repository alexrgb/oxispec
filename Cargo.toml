[workspace]
resolver = "3"
members = ["crates/oxispec-core", "crates/oxispec-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexrgb/oxispec"
rust-version = "1.89"
# Not published to crates.io yet. Remove when the first release is published.
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"
thiserror = "2"
