[workspace]
resolver = "3"
members = ["crates/oxispec-core", "crates/oxispec-cli", "crates/oxispec-stress"]

[workspace.package]
version = "0.1.0-rc.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexrgb/oxispec"
rust-version = "1.89"
homepage = "https://github.com/alexrgb/oxispec"
keywords = ["specs", "adr", "requirements", "mcp", "ai-agents"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# The version moves with `workspace.package.version` in every release.
oxispec-core = { path = "crates/oxispec-core", version = "=0.1.0-rc.3" }
anyhow = "1"
blake3 = { version = "1", features = ["pure"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
ignore = "0.4"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"
tempfile = "3"
thiserror = "2"
tiny_http = "0.12"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
